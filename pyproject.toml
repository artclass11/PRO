[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowpilot"
version = "0.1.0"
description = "Simulate AI agent actions before execution: impact, risk, reversibility, and receipts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ShadowPilot contributors"}]
dependencies = []

[project.scripts]
shadowpilot = "shadowpilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["shadowpilot*"]
